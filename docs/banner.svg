<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" fill="none">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <!-- Accent gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#f778ba"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Soft glow for orbs -->
    <radialGradient id="orbGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f778ba" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f778ba" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- Ambient glow orbs -->
  <circle cx="200" cy="100" r="180" fill="url(#orbGlow1)"/>
  <circle cx="1050" cy="220" r="200" fill="url(#orbGlow2)"/>
  <circle cx="640" cy="300" r="150" fill="url(#orbGlow3)"/>

  <!-- Grid pattern (subtle) -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="960" y1="0" x2="960" y2="320"/>
    <line x1="1120" y1="0" x2="1120" y2="320"/>
  </g>

  <!-- Neural network decorative nodes and connections (left side) -->
  <g opacity="0.4">
    <!-- Left cluster -->
    <circle cx="80" cy="80" r="3" fill="#58a6ff"/>
    <circle cx="120" cy="140" r="2.5" fill="#58a6ff"/>
    <circle cx="60" cy="200" r="2" fill="#58a6ff"/>
    <circle cx="140" cy="240" r="3" fill="#bc8cff"/>
    <circle cx="100" cy="160" r="2" fill="#bc8cff"/>
    <line x1="80" y1="80" x2="120" y2="140" stroke="#58a6ff" stroke-width="0.8" opacity="0.5"/>
    <line x1="120" y1="140" x2="60" y2="200" stroke="#58a6ff" stroke-width="0.6" opacity="0.4"/>
    <line x1="60" y1="200" x2="140" y2="240" stroke="#bc8cff" stroke-width="0.7" opacity="0.4"/>
    <line x1="120" y1="140" x2="100" y2="160" stroke="#bc8cff" stroke-width="0.5" opacity="0.3"/>

    <!-- Right cluster -->
    <circle cx="1200" cy="60" r="2.5" fill="#f778ba"/>
    <circle cx="1160" cy="120" r="3" fill="#bc8cff"/>
    <circle cx="1220" cy="180" r="2" fill="#58a6ff"/>
    <circle cx="1180" cy="250" r="2.5" fill="#f778ba"/>
    <circle cx="1240" cy="140" r="2" fill="#58a6ff"/>
    <line x1="1200" y1="60" x2="1160" y2="120" stroke="#bc8cff" stroke-width="0.8" opacity="0.5"/>
    <line x1="1160" y1="120" x2="1220" y2="180" stroke="#58a6ff" stroke-width="0.6" opacity="0.4"/>
    <line x1="1220" y1="180" x2="1180" y2="250" stroke="#f778ba" stroke-width="0.7" opacity="0.4"/>
    <line x1="1160" y1="120" x2="1240" y2="140" stroke="#58a6ff" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Feature icons row -->
  <g transform="translate(640, 230)" text-anchor="middle">
    <!-- Eye icon (Vision) -->
    <g transform="translate(-240, 0)">
      <ellipse cx="0" cy="0" rx="16" ry="10" stroke="#58a6ff" stroke-width="1.5" fill="none" opacity="0.7"/>
      <circle cx="0" cy="0" r="4" fill="#58a6ff" opacity="0.7"/>
      <text y="28" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">Vision</text>
    </g>

    <!-- Brain icon (AI) -->
    <g transform="translate(-80, 0)">
      <path d="M-8,-10 Q-12,-10 -12,-4 Q-12,0 -8,2 Q-12,4 -12,8 Q-12,12 -8,12 Q-6,14 -2,14 Q0,16 4,14 Q8,14 10,12 Q14,12 14,8 Q14,4 10,2 Q14,0 14,-4 Q14,-10 10,-10 Q8,-12 4,-12 Q0,-14 -2,-12 Q-6,-12 -8,-10Z" stroke="#bc8cff" stroke-width="1.5" fill="none" opacity="0.7"/>
      <text y="28" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">Brain</text>
    </g>

    <!-- Chat bubble icon -->
    <g transform="translate(80, 0)">
      <path d="M-12,-8 Q-12,-12 -8,-12 L8,-12 Q12,-12 12,-8 L12,4 Q12,8 8,8 L0,8 L-4,14 L-4,8 L-8,8 Q-12,8 -12,4Z" stroke="#f778ba" stroke-width="1.5" fill="none" opacity="0.7"/>
      <circle cx="-4" cy="-2" r="1.5" fill="#f778ba" opacity="0.7"/>
      <circle cx="0" cy="-2" r="1.5" fill="#f778ba" opacity="0.7"/>
      <circle cx="4" cy="-2" r="1.5" fill="#f778ba" opacity="0.7"/>
      <text y="28" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">Chat</text>
    </g>

    <!-- Monitor icon (Desktop) -->
    <g transform="translate(240, 0)">
      <rect x="-14" y="-10" width="28" height="18" rx="2" stroke="#58a6ff" stroke-width="1.5" fill="none" opacity="0.7"/>
      <line x1="-6" y1="12" x2="6" y2="12" stroke="#58a6ff" stroke-width="1.5" opacity="0.7"/>
      <line x1="0" y1="8" x2="0" y2="12" stroke="#58a6ff" stroke-width="1.5" opacity="0.7"/>
      <text y="28" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">Desktop</text>
    </g>
  </g>

  <!-- Connecting line between icons -->
  <line x1="420" y1="230" x2="860" y2="230" stroke="url(#accent)" stroke-width="1" opacity="0.2"/>

  <!-- Main title -->
  <text x="640" y="110" text-anchor="middle" fill="white" font-family="Segoe UI, -apple-system, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">
    AlphaVision Bridge
  </text>

  <!-- Accent underline -->
  <rect x="440" y="125" width="400" height="3" rx="1.5" fill="url(#accent)" opacity="0.8"/>

  <!-- Subtitle -->
  <text x="640" y="165" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, -apple-system, sans-serif" font-size="18" font-weight="400">
    AI-Powered Multimodal Desktop Companion Bridge
  </text>

  <!-- Tech stack tags -->
  <g transform="translate(640, 192)" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="11">
    <g transform="translate(-140, 0)">
      <rect x="-38" y="-10" width="76" height="20" rx="10" fill="#58a6ff" fill-opacity="0.15" stroke="#58a6ff" stroke-width="0.8" stroke-opacity="0.4"/>
      <text y="4" fill="#58a6ff">Gemini API</text>
    </g>
    <g transform="translate(-40, 0)">
      <rect x="-42" y="-10" width="84" height="20" rx="10" fill="#bc8cff" fill-opacity="0.15" stroke="#bc8cff" stroke-width="0.8" stroke-opacity="0.4"/>
      <text y="4" fill="#bc8cff">SillyTavern</text>
    </g>
    <g transform="translate(66, 0)">
      <rect x="-42" y="-10" width="84" height="20" rx="10" fill="#f778ba" fill-opacity="0.15" stroke="#f778ba" stroke-width="0.8" stroke-opacity="0.4"/>
      <text y="4" fill="#f778ba">MateEngine</text>
    </g>
    <g transform="translate(160, 0)">
      <rect x="-28" y="-10" width="56" height="20" rx="10" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950" stroke-width="0.8" stroke-opacity="0.4"/>
      <text y="4" fill="#3fb950">Python</text>
    </g>
  </g>

  <!-- Bottom fade line -->
  <rect x="0" y="316" width="1280" height="4" fill="url(#accent)" opacity="0.3"/>
</svg>
